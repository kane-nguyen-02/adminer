services:
  adminer:
    build:
      context: ./adminer
      dockerfile: Dockerfile
    image: adminer-custom:6.0.1-mongodb
    container_name: adminer
    restart: unless-stopped
    network_mode: host
    # Sessions hold Adminer's connection registry ($_SESSION["pwds"]), which is
    # what the connection switcher lists. PHP's defaults put them in /tmp and
    # expire them after 1440s of inactivity, so the list emptied itself after
    # ~24 idle minutes and on every container restart. Pin them to the volume
    # and match the 30 days Adminer already uses for its own cookies.
    #
    # session.cookie_lifetime is deliberately NOT set here: Adminer calls
    # session_set_cookie_params(['lifetime' => 0]) itself, so adminer_sid is
    # always a browser-session cookie and the ini setting is dead weight.
    # Closing the browser therefore still drops the session - the
    # `adminer_permanent` cookie (30 days) is what carries connections across
    # that, which is why login-permanent.php has to exist.
    command:
      - php
      - -d
      - session.save_path=/sessions
      - -d
      - session.gc_maxlifetime=2592000
      - -S
      - "[::]:6868"
      - -t
      - /var/www/html
    volumes:
      - ./adminer/adminer.css:/var/www/html/adminer.css:ro
      - ./adminer/adminer-dark.css:/var/www/html/adminer-dark.css:ro
      - ./adminer/plugins-enabled/menu-links.php:/var/www/html/plugins-enabled/menu-links.php:ro
      - ./adminer/plugins-enabled/brand-name.php:/var/www/html/plugins-enabled/brand-name.php:ro
      - ./adminer/plugins-enabled/default-pgsql.php:/var/www/html/plugins-enabled/default-pgsql.php:ro
      - ./adminer/plugins-enabled/mongo.php:/var/www/html/plugins-enabled/mongo.php:ro
      - ./adminer/plugins-enabled/redis.php:/var/www/html/plugins-enabled/redis.php:ro
      - ./adminer/plugins-enabled/login-ip.php:/var/www/html/plugins-enabled/login-ip.php:ro
      - ./adminer/plugins-enabled/cell-filter.php:/var/www/html/plugins-enabled/cell-filter.php:ro
      - ./adminer/plugins-enabled/row-num.php:/var/www/html/plugins-enabled/row-num.php:ro
      - ./adminer/plugins-enabled/select-shortcuts.php:/var/www/html/plugins-enabled/select-shortcuts.php:ro
      - ./adminer/plugins-enabled/select-searchable.php:/var/www/html/plugins-enabled/select-searchable.php:ro
      - ./adminer/plugins-enabled/select-limit-persist.php:/var/www/html/plugins-enabled/select-limit-persist.php:ro
      - ./adminer/plugins-enabled/theme-switcher.php:/var/www/html/plugins-enabled/theme-switcher.php:ro
      - ./adminer/plugins-enabled/table-style-switcher.php:/var/www/html/plugins-enabled/table-style-switcher.php:ro
      - ./adminer/plugins-enabled/row-highlight.php:/var/www/html/plugins-enabled/row-highlight.php:ro
      - ./adminer/plugins-enabled/select-check-ui.php:/var/www/html/plugins-enabled/select-check-ui.php:ro
      - ./adminer/plugins-enabled/select-smart-filter.php:/var/www/html/plugins-enabled/select-smart-filter.php:ro
      - ./adminer/plugins-enabled/select-row-inspector.php:/var/www/html/plugins-enabled/select-row-inspector.php:ro
      - ./adminer/plugins-enabled/select-autoapply.php:/var/www/html/plugins-enabled/select-autoapply.php:ro
      - ./adminer/plugins-enabled/menu-filter-fix.php:/var/www/html/plugins-enabled/menu-filter-fix.php:ro
      - ./adminer/plugins-enabled/select-toolbar-icons.php:/var/www/html/plugins-enabled/select-toolbar-icons.php:ro
      - ./adminer/plugins-enabled/structure-enum.php:/var/www/html/plugins-enabled/structure-enum.php:ro
      - ./adminer/plugins-enabled/select-json-edit.php:/var/www/html/plugins-enabled/select-json-edit.php:ro
      - ./adminer/plugins-enabled/auth-buttons.php:/var/www/html/plugins-enabled/auth-buttons.php:ro
      - ./adminer/plugins-enabled/select-sort-dir.php:/var/www/html/plugins-enabled/select-sort-dir.php:ro
      - ./adminer/plugins-enabled/sidebar-collapse.php:/var/www/html/plugins-enabled/sidebar-collapse.php:ro
      - ./adminer/plugins-enabled/connection-switcher.php:/var/www/html/plugins-enabled/connection-switcher.php:ro
      - ./adminer/plugins-enabled/login-permanent.php:/var/www/html/plugins-enabled/login-permanent.php:ro
      - ./adminer/plugins-enabled/login-defaults.php:/var/www/html/plugins-enabled/login-defaults.php:ro
      - ./adminer/plugins-enabled/dump-pgsql-fix.php:/var/www/html/plugins-enabled/dump-pgsql-fix.php:ro
      # - ./adminer/plugins-enabled/resize-menu.php:/var/www/html/plugins-enabled/resize-menu.php:ro
      - ./adminer/plugins-enabled/pg-backup.php:/var/www/html/plugins-enabled/pg-backup.php:ro
      - ./adminer/plugins-enabled/pg-drop-force.php:/var/www/html/plugins-enabled/pg-drop-force.php:ro
      - ./adminer/plugins-enabled/bool-friendly.php:/var/www/html/plugins-enabled/bool-friendly.php:ro
      - ./adminer/plugins-enabled/select-inline-choice.php:/var/www/html/plugins-enabled/select-inline-choice.php:ro
      - ./adminer/plugins-enabled/select-edit-highlight.php:/var/www/html/plugins-enabled/select-edit-highlight.php:ro
      - adminer-sessions:/sessions
      # pg_dump output. A named volume, not a bind mount: these files are
      # database contents, and the repo is a git working tree.
      - adminer-backups:/backups
    environment:
      TZ: Asia/Ho_Chi_Minh
      # Encryption key for the "Permanent login" cookie. Set it in .env (which
      # is gitignored) - NOT here. Unset means Adminer falls back to its
      # ephemeral /tmp/adminer.key and remembered logins break on restart.
      # See adminer/plugins-enabled/login-permanent.php for the security note.
      ADMINER_PERMANENT_KEY: ${ADMINER_PERMANENT_KEY:-}
      ADMINER_DEFAULT_SERVER: localhost
      ADMINER_PLUGINS: >-
        dark-switcher
        tables-filter
        edit-foreign
        edit-textarea
        enum-option
        dump-json
        sql-log

volumes:
  adminer-sessions:
  adminer-backups:
